{% extends 'base.html' %}

{% block title %}Create Warehouse — StockSense{% endblock %}
{% block header_title %}Add New Warehouse Facility{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header">
    <div class="card-title">
      <i class="fa-solid fa-warehouse" style="color: var(--primary);"></i>
      Warehouse Details
    </div>
    <a href="{{ url_for('warehouses.index') }}" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Cancel
    </a>
  </div>

  <div class="card-body">
    <form action="{{ url_for('warehouses.create_warehouse') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="name">Warehouse Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Main Warehouse" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="code">Warehouse Code *</label>
        <input type="text" id="code" name="code" class="form-control" placeholder="e.g. WH-MAIN" required>
        <div class="form-text">Unique code identifier for this facility.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="address">Facility Address</label>
        <textarea id="address" name="address" class="form-control" rows="3" placeholder="100 Industrial Parkway, Sector 4..."></textarea>
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
        <a href="{{ url_for('warehouses.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Create Warehouse
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
