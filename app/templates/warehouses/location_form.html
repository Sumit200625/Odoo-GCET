{% extends 'base.html' %}

{% block title %}Create Location — StockSense{% endblock %}
{% block header_title %}Add New Storage Location{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header">
    <div class="card-title">
      <i class="fa-solid fa-location-dot" style="color: var(--primary);"></i>
      Storage Location Form
    </div>
    <a href="{{ url_for('warehouses.index') }}" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Cancel
    </a>
  </div>

  <div class="card-body">
    <form action="{{ url_for('warehouses.create_location') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="warehouse_id">Parent Warehouse *</label>
        <select id="warehouse_id" name="warehouse_id" class="form-select" required autofocus>
          <option value="">Select Warehouse</option>
          {% for wh in warehouses %}
            <option value="{{ wh.id }}">{{ wh.name }} ({{ wh.code }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="name">Location Name *</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rack A / Shelf 2" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="code">Location Code *</label>
        <input type="text" id="code" name="code" class="form-control" placeholder="e.g. LOC-RACK-A" required>
        <div class="form-text">Unique code identifier for this location.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="location_type">Location Type</label>
        <select id="location_type" name="location_type" class="form-select">
          <option value="Internal">Internal (Warehouse Storage)</option>
          <option value="Customer">Customer Location (Outgoing)</option>
          <option value="Vendor">Vendor Location (Incoming)</option>
          <option value="Inventory Loss">Inventory Loss / Scrap</option>
        </select>
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
        <a href="{{ url_for('warehouses.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Save Location
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
