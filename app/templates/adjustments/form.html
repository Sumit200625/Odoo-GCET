{% extends 'base.html' %}

{% block title %}Create Stock Adjustment — StockSense{% endblock %}
{% block header_title %}Create Inventory Physical Count Adjustment{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
  <div class="card-header">
    <div class="card-title">
      <i class="fa-solid fa-sliders" style="color: var(--primary);"></i>
      Stock Adjustment Form
    </div>
    <a href="{{ url_for('adjustments.index') }}" class="btn btn-secondary btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Cancel
    </a>
  </div>

  <div class="card-body">
    <form action="{{ url_for('adjustments.create') }}" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="adj_location_id">Warehouse Storage Location *</label>
          <select id="adj_location_id" name="location_id" class="form-select" required autofocus>
            <option value="">Select Location to Audit...</option>
            {% for loc in locations %}
              <option value="{{ loc.id }}">{{ loc.full_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="reason">Reason / Audit Note</label>
          <input type="text" id="reason" name="reason" class="form-control" placeholder="e.g. Physical count discrepancy, Damaged goods...">
        </div>
      </div>

      <hr style="margin: 24px 0; border: none; border-top: 1px solid var(--border-color);">
      <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 16px;">Item Count Details</h4>

      <div class="form-grid" style="grid-template-columns: 2fr 1fr 1fr 1fr;">
        <div class="form-group">
          <label class="form-label" for="adj_product_id">Product *</label>
          <select id="adj_product_id" name="product_id[]" class="form-select" required>
            <option value="">Select Product...</option>
            {% for p in products %}
              <option value="{{ p.id }}">{{ p.name }} ({{ p.sku }}) — {{ p.unit }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Recorded Stock</label>
          <input type="text" id="recorded_quantity_display" class="form-control" value="0.0" readonly style="background-color: #f1f5f9; font-weight: 700;">
        </div>

        <div class="form-group">
          <label class="form-label" for="counted_quantity">Counted Stock *</label>
          <input type="number" step="0.01" min="0" id="counted_quantity" name="counted_quantity[]" class="form-control" placeholder="0.0" required>
        </div>

        <div class="form-group">
          <label class="form-label">Difference</label>
          <input type="text" id="difference_display" class="form-control" value="0" readonly style="background-color: #f1f5f9; font-weight: 700; color: var(--primary);">
        </div>
      </div>

      <div style="margin-top: 28px; display: flex; justify-content: flex-end; gap: 12px;">
        <a href="{{ url_for('adjustments.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Create Adjustment (Draft)
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
