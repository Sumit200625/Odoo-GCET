{% extends 'base.html' %}

{% block title %}System Settings — StockSense{% endblock %}
{% block header_title %}System Configuration & Settings{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
  <div class="card-header">
    <div class="card-title">
      <i class="fa-solid fa-gears" style="color: var(--primary);"></i>
      System Preferences & Configuration
    </div>
    <span class="badge badge-waiting">Manager & Admin Access</span>
  </div>

  <div class="card-body">
    <form onsubmit="event.preventDefault(); alert('Settings saved successfully!');">
      <div class="form-group">
        <label class="form-label">System Name</label>
        <input type="text" class="form-control" value="StockSense Enterprise Inventory Management" readonly style="background: #f1f5f9;">
      </div>

      <div class="form-group">
        <label class="form-label">Default Currency</label>
        <select class="form-select">
          <option value="USD">USD ($)</option>
          <option value="INR" selected>INR (₹)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Low Stock Notification Threshold Policy</label>
        <select class="form-select">
          <option value="reorder" selected>Trigger alert when quantity <= Reorder Level</option>
          <option value="zero">Trigger alert only when quantity == 0 (Out of Stock)</option>
        </select>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="auto_audit" checked style="width: auto;">
        <label for="auto_audit" style="font-size: 14px; margin-bottom: 0;">Enforce Immutable Move History Stock Ledger logging</label>
      </div>

      <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Save Settings
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
